# -- Site Configuration --
# Refer to the theme docs for more details about each of these parameters.
# https://jpanther.github.io/congo/docs/getting-started/

baseURL = "https://lol-website.duketedder.workers.dev/"
title = "Duke's Drafting"
theme = "congo"
defaultContentLanguage = "en"

enableRobotsTXT = true
summaryLength = 0
languageCode = "en-us"
copyright = "&copy; 2026 Duke"

[params]
  dateFormat = "2 January 2006"
  mainSections = ["posts"]
  description = "My personal blog"

  [params.author]
    name = "Duke"
    headline = "Welcome to my blog"
    bio = "League of Legends Blog"

[pagination]
  pagerSize = 15

[outputs]
  home = ["HTML", "RSS", "JSON"]

[privacy]
  [privacy.vimeo]
    enableDNT = true
  [privacy.x]
    enableDNT = true
  [privacy.youTube]
    privacyEnhanced = true

[services]
  [services.x]
    disableInlineCSS = true
